controls:
  RSP: "Equal-weight S&P 500: market control that does not absorb the AI names (prereg)."
  TLT: "Long Treasury ETF: rates control."
  SPY: "Cap-weighted S&P 500: robustness control in place of RSP."
  QQQ: "Nasdaq-100 ETF: tech-beta reference."
  SMH: "Semiconductor ETF: sector reference for the semis sub-basket."
  XLU: "Utilities sector ETF: benchmark for the power/data-centre sub-basket (E3)."

futures:
  NQ=F: "E-mini Nasdaq-100 future, ~23 h/day: election-night tech read."
