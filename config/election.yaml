# Milestone 2 (election study) data config: single source of truth for step 8.
# Frozen design: docs/election/preregistration.md. Dates are quoted strings (UTC `Z`, or ET dates
# where stated). Token ids come from Gamma GET /events/<id>, markets matched by question text.
# `closed` is Gamma's closedTime, used only to bound the pull range (never to select data at t).

study:
  data_start: "2025-06-01"     # ET date, first yfinance day (1d and 1h)
  data_end: "2026-11-13"       # ET date, EXCLUSIVE; last session in the data is 2026-11-12
  vol_start: "2018-01-01"      # ET date, vol-index daily history start
  pm_start: "2025-07-11T00:00:00Z"
  pre_sample_start: "2025-07-14"
  pre_sample_end: "2026-11-02"

asof:                          # maximum age of an odds reading before it is missing
  daily_max_age_s: 21600       # 6 h at a daily close
  hourly_max_age_s: 1800       # 30 min at an hourly bar end
  night_max_age_s: 600         # 10 min at a 5-minute bar end

windows:
  fid1_start: "2026-11-03T18:00:00Z"
  fid1_end: "2026-11-04T18:00:00Z"
  futures_5m_start: "2026-10-27"   # ET date
  futures_5m_end: "2026-11-07"     # ET date, exclusive
  h3_start_et: "2026-11-03T18:00:00"   # wall-clock America/New_York
  h3_end_et: "2026-11-04T09:30:00"
  h3_margin_min: 30

