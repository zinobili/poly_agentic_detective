- id: us_cpi_inflation
  priority: primary
  analysis: release_day_event_study
  description: 'Monthly US CPI YoY bucket events (one per BLS release) vs long-duration Treasuries and growth equities.
    CPI is released 08:30 ET, outside the stock session, and the market-implied level barely moves between releases,
    so hourly lead-lag is not attempted: the analysis is a release-day event study comparing the pre-release implied
    CPI (and its change over the prior days) with the open-gap/first-hour returns.'
  tickers:
  - TLT
  - QQQ
  expected_sign:
    TLT: negative
    QQQ: negative
  rationale: 'A higher market-implied CPI raises the odds of higher-for-longer policy, lifting yields: TLT falls,
    and long-duration growth stocks (QQQ) fall more than the broad market.'
  signal:
    name: implied_cpi_yoy
    formula: sum_i(p_i * c_i) / sum_i(p_i) over the merged buckets
    zero_mass: if sum_i(p_i) == 0 for an hour, drop the hour (no signal; never fill with 0)
    edge_bucket_centres: boundary -/+ 0.1 (e.g. '<=2.1' -> 2.0; '>=2.7' -> 2.8)
    edge_mass: edge_mass = (p of low+high edge buckets) / sum_i(p_i); flag stored per hour
    drop_rule: drop the hour if edge_mass > 0.1
    validation: For each resolved month, the implied CPI at release_time_utc - 1h must lie within one bucket width
      (0.1pp; for an edge winner, within 0.1pp beyond the boundary) of the winning bucket's centre in a majority
      of months, else the method is revised BEFORE any stock returns are examined. A derived 'range' bucket (2026-01
      '2.7-2.8', width 0.2, centre 2.75) uses tolerance = half its width (0.1pp) (A19).
    companion_events: merged signal for a month is defined only from first_usable_utc = the hour when every companion
      event is open; earlier hours are dropped (companion_dropped_hours; A18)
    derived_bucket_clip: p = max(0, sum(plus) - sum(minus)); step 3 logs how often the clip binds (A19)
  roll_rule:
    rule: Event for release R is used from the previous release's roll time to R's release time + 1 hour. Release
      08:30 America/New_York -> UTC (DST-aware). Never roll on gamma endDate or closed flag. Between events there
      may be gaps (an event often opens after the previous release); those hours carry no signal.
    roll_offset_hours: 1
    event_time: BLS CPI release 08:30 America/New_York
  splice_rule: Signals are spliced from CHANGES, never from levels. Never difference across two different events
    (a level in event A and a level in event B are not comparable). At a roll hour, use the NEW event's own 1-hour
    change (its price at roll_utc+1h minus its price at roll_utc) and set roll_hour=true so step 6 can exclude that
    bar. Any level series is rebuilt only by cumulating the spliced changes.
  trading_hours_note: 'Lead-lag runs only on hours when BOTH markets trade (US regular session 09:30-16:00 ET; yfinance
    1h bars). Overnight/weekend Polymarket moves are compared against the next opening gap separately (close-to-open
    return), not folded into hourly lead-lag. CPI releases at 08:30 ET: the reaction is measured as the 09:30 ET
    opening gap and first hourly bar.'
  coverage:
    stock_window_start_utc: '2024-10-01T00:00:00Z'
    signal_first_active_utc: '2024-11-14T17:23:08Z'
    signal_last_active_through: '2026-10-01'
