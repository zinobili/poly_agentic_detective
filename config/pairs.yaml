- id: bitcoin_monthly_ladder
  priority: primary
  analysis: lead_lag_hourly_vs_spot_baseline
  description: Monthly 'what price will Bitcoin hit in <month>' touch-market ladders (reach $K above / dip to $K
    below) vs Bitcoin-linked equities. The question is whether Polymarket adds information beyond BTC-USD spot,
    not whether it correlates with BTC.
  tickers:
  - COIN
  - MSTR
  - IBIT
  - BTC-USD
  - XLU
  ticker_roles:
    IBIT: direct target (spot BTC ETF)
    COIN: target
    MSTR: target
    BTC-USD: 'REQUIRED baseline: yfinance 24/7 spot; every result must be shown with and without controlling for
      spot returns'
    XLU: placebo (utilities; no BTC exposure)
  expected_sign:
    COIN: positive
    MSTR: positive
    IBIT: positive
    BTC-USD: positive
    XLU: zero (placebo)
  rationale: 'A rising ladder-implied BTC level raises COIN (volume/fee revenue), MSTR (leveraged BTC treasury)
    and IBIT (spot ETF); IBIT is a direct target, not a control. Because BTC-USD trades 24/7 and Polymarket ladders
    are largely a function of spot, the informative test is incremental: do Polymarket changes predict stock returns
    after conditioning on BTC-USD spot returns? XLU is a placebo that should show no relationship.'
  signal:
    name: btc_ladder_level_and_skew
    per_hour_procedure:
    - 'A20/A21 RUNG SELECTION (poly_actor.pairs.select_ladder): at hour t a dip strike K is TOUCHED if any dip rung
      with strike <= K in that month has closed_time <= t and resolved Yes (BTC fell to the lower strike, so it
      fell to every higher one); an up strike K is TOUCHED if any up rung with strike >= K has closed_time <= t
      and resolved Yes. A touched strike has P=1 and every rung at that strike (fresh or not) is ignored. For an
      untouched strike use the whole-month rung if one exists at that strike AT t (created_utc <= t; a whole-month
      rung created after t does not suppress a partial rung); use a partial-window rung (partial_window=true, partial_window_detected_by
      lists slug / description_creation / description_between / created_after_touch) only if no whole-month rung
      exists at that strike. At most ONE rung per strike per hour (no tie-averaging of different questions; ties
      among eligible rungs of one kind: earliest created_utc, then slug). A rung with no CLOB quote at t is skipped
      at t. Rung direction comes from the resolution text (final High price = up, final Low price = dip), falling
      back to the question; rungs where the description overrides the question carry direction_from_description=true
      (A21). Rungs with active=false and no closedTime in the final snapshot (inactive_excluded; Gamma may still
      carry a stale outcomePrices) are excluded.'
    - 'A rung counts at hour t only if its event has been open for at least 24h (t >= gamma_start + 24h; see first_usable_utc)
      AND the RUNG ITSELF is at least 24h old (t >= created_utc + 24h = rung_usable_from_utc; A15) AND the rung
      is open at t (t < closed_time or closed_time null); touched strikes follow the A20 rule above (P=1 from the
      touching rung''s closed_time). NO lifetime-volume filter: lifetime volume is only known at pull time (look-ahead).
      Step 3 may add cumulative-volume-to-t (computed from trades, if available) as a time-t liquidity filter.'
    - 'Up-ladder: selected rungs ''reach $K'' ordered by K ascending (P non-increasing). Before interpolating, apply
      isotonic regression (safety net only after A20) (pool-adjacent-violators, unit weights) to the hour''s rung
      probabilities: non-increasing in strike on the up-ladder, non-decreasing in strike on the dip-ladder (A15;
      poly_actor.pairs.monotone_ladder_crossing). Then take the FIRST crossing of 0.5 walking away from spot and
      find the strike K_up* by linear interpolation of log(K) in P between the two bracketing rungs. No extrapolation;
      if 0.5 is not bracketed, drop the hour.'
    - 'Dip-ladder: rungs ''dip to $K'' ordered by K descending; find K_dn* where P=0.5 the same way.'
    - ladder_level = exp((ln K_up* + ln K_dn*)/2); half_width = (ln K_up* - ln K_dn*)/2.
    - skew = ln K_up* + ln K_dn* - 2*ln(S_t) with S_t = BTC-USD spot (positive = upside rungs further away than
      downside rungs relative to spot).
    min_event_age_hours: 24
    min_rung_age_hours: 24
    ladder_monotone_fit: isotonic regression (PAVA) per ladder per hour before the 0.5 crossing (A15)
    partial_window_rungs: recorded per month (partial_window_rungs, with detection methods) and summarised in coverage.partial_window_summary;
      used only per the A20 fallback rule
    pav_pooling_metric: isotonic regression is only a safety net after A20 selection; step 3 logs the share of hours
      where PAV pools anything (poly_actor.pairs.monotone_ladder_crossing_diag)
    dropped_hours_metric: step 3 reports the share of hours dropped (0.5 not bracketed, no usable rungs, month-start
      gap) per month and overall
    primary_signal: hourly change in ln(ladder_level)
    why_not_nearest_0.5_reach_threshold: Touch markets pin to 1 and close within days once touched, and zombie rungs
      (e.g. $2 of volume) can sit near 0.5 on stale quotes; a single-rung signal is degenerate.
  roll_rule:
    rule: Event for calendar month M is used from the previous month's roll time to roll_utc of month M, where roll_utc
      = midnight America/New_York at the end of month M (-> UTC, DST-aware) + 1 hour. Never roll on gamma endDate
      or closed flag.
    roll_offset_hours: 1
    event_time: 00:00 America/New_York on the 1st of the following month
  splice_rule: Signals are spliced from CHANGES, never from levels. Never difference across two different events
    (a level in event A and a level in event B are not comparable). At a roll hour, use the NEW event's own 1-hour
    change (its price at roll_utc+1h minus its price at roll_utc) and set roll_hour=true so step 6 can exclude that
    bar. Any level series is rebuilt only by cumulating the spliced changes.
  trading_hours_note: 'Lead-lag runs only on hours when BOTH markets trade (US regular session 09:30-16:00 ET; yfinance
    1h bars). Overnight/weekend Polymarket moves are compared against the next opening gap separately (close-to-open
    return), not folded into hourly lead-lag. BTC-USD and Polymarket trade 24/7 but the equity targets do not: lead-lag
    on stock targets uses equity-session hours only, overnight BTC moves are compared against the opening gap, and
    every result is controlled for BTC-USD spot returns.'
  coverage:
    stock_window_start_utc: '2024-10-01T00:00:00Z'
    signal_first_active_utc: '2024-11-02T15:04:59Z'
    signal_last_active_through: '2026-10-01'
    gaps:
