- id: us_recession
  priority: secondary
  analysis: event_study
  description: '''Will the US enter a recession'' (calendar-year horizon) vs equities, small-cap relative performance
    and long Treasuries. Effectively one episode (the 2025 market resolved No), so no lead-lag inference is claimed;
    event study around large probability moves only.'
  tickers:
  - SPY
  - IWM
  - TLT
  - IWM-SPY
  expected_sign:
    SPY: negative
    IWM: negative
    TLT: positive
    IWM-SPY: negative
  rationale: 'Rising recession odds are a growth/earnings warning: SPY falls, and small caps (IWM) fall more because
    of floating-rate debt and thinner margins, so the IWM-SPY spread should fall. TLT should rise on flight to quality
    and expected easing. Signal: change in P(Yes).'
  signal:
    name: recession_p_yes
    formula: hourly P(Yes) of the active market; use hourly changes
  roll_rule:
    rule: Use us-recession-in-2025 until 2025-10-01T00:00:00Z (pre-registered, one quarter before its year-end horizon,
      when its probability collapses toward 0 and stops being informative), then us-recession-by-end-of-2026. Both
      markets are open in the overlap (2026 market opened 2025-09-29). Do not roll on closed_time/endDate.
    roll_utc: '2025-10-01T00:00:00Z'
    roll_offset_hours: 0
  event_times_utc:
  - event: switch_to_2026_market
    roll_utc: '2025-10-01T00:00:00Z'
  splice_rule: Signals are spliced from CHANGES, never from levels. Never difference across two different events
    (a level in event A and a level in event B are not comparable). At a roll hour, use the NEW event's own 1-hour
    change (its price at roll_utc+1h minus its price at roll_utc) and set roll_hour=true so step 6 can exclude that
    bar. Any level series is rebuilt only by cumulating the spliced changes.
  trading_hours_note: Lead-lag runs only on hours when BOTH markets trade (US regular session 09:30-16:00 ET; yfinance
    1h bars). Overnight/weekend Polymarket moves are compared against the next opening gap separately (close-to-open
    return), not folded into hourly lead-lag.
  coverage:
    stock_window_start_utc: '2024-10-01T00:00:00Z'
    signal_first_active_utc: '2025-01-08T01:33:54Z'
    signal_last_active_through: '2026-10-01'
    gaps:
    - from_utc: '2024-10-01T00:00:00Z'
      to_utc: '2025-01-08T01:33:54Z'
      reason: no recession market exists before the 2025 market opened
    note: '2025 market: closedTime 2026-01-01T09:23:25Z (the event-level endDate of 2026-02-28 is misleading). 2026
