[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "poly_actor"
version = "0.0.1"
description = "Polymarket-to-stock-market signal lab"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "duckdb>=1.0",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "plotly>=5.20",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "exchange_calendars>=4.5",
    "tzdata>=2024.1",  # zoneinfo on Windows has no system tz database
    "scipy>=1.13",  # t/normal distributions, rank tests (step 6 analysis)
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.40,<2",
]
dev = [
    "poly_actor[dashboard]",
    "pytest>=8",
    "ruff>=0.6",
    "jupyterlab>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not live\""
markers = [
    "live: hits real external APIs (deselected by default via addopts; run with -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]
